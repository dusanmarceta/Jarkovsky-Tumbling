<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <style>
    .ink { fill: #0b0b0b; }
    .ink2 { fill: #52514e; }
    .line { stroke: #52514e; fill: none; }
    .muted { stroke: #898781; fill: none; }
    .plane { fill: #2a78d6; fill-opacity: 0.06; stroke: #2a78d6; stroke-opacity: 0.55; }
    .sun { fill: #eda100; }
    .body { fill: #898781; }
    .spin { stroke: #eb6834; fill: none; }
    .spinfill { fill: #eb6834; }
    .spintext { fill: #c24a1a; }
    .axisfill { fill: #52514e; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f0efec; }
      .ink2 { fill: #c3c2b7; }
      .line { stroke: #c3c2b7; }
      .plane { fill: #3987e5; fill-opacity: 0.10; stroke: #3987e5; stroke-opacity: 0.7; }
      .sun { fill: #c98500; }
      .body { fill: #c3c2b7; }
      .spin { stroke: #d95926; }
      .spinfill { fill: #d95926; }
      .spintext { fill: #f08a5d; }
      .axisfill { fill: #c3c2b7; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="axisfill"/>
    </marker>
    <marker id="arrowSpin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="spinfill"/>
    </marker>
  </defs>

  <!-- orbital plane and orbit -->
  <ellipse cx="300" cy="215" rx="250" ry="80" class="plane" stroke-width="1.5"/>
  <text x="62" y="300" class="ink2">orbital plane</text>
  <path d="M 538 240 Q 520 268 480 280" class="muted" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="520" y="295" class="ink2">orbital motion</text>

  <!-- frame at the Sun -->
  <circle cx="390" cy="215" r="11" class="sun"/>
  <text x="372" y="244" class="ink">Sun</text>
  <line x1="390" y1="215" x2="560" y2="215" class="line" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="566" y="219" class="ink">x</text>
  <text x="478" y="207" class="ink2">to perihelion</text>
  <line x1="390" y1="215" x2="390" y2="92" class="line" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="397" y="98" class="ink">z</text>
  <text x="397" y="116" class="ink2">orbital angular momentum</text>
  <line x1="390" y1="215" x2="345" y2="268" class="line" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="282" class="ink">y</text>

  <!-- asteroid with its spin axis -->
  <circle cx="150" cy="232" r="13" class="body"/>
  <line x1="150" y1="232" x2="150" y2="110" class="muted" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="156" y="118" class="ink2">∥ z</text>
  <line x1="150" y1="232" x2="215" y2="232" class="muted" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="220" y="236" class="ink2">∥ x</text>
  <!-- projection of L onto the orbital plane -->
  <line x1="150" y1="232" x2="98" y2="257" class="muted" stroke-width="1.2" stroke-dasharray="2 3"/>
  <line x1="98" y1="257" x2="98" y2="150" class="muted" stroke-width="0.8" stroke-dasharray="2 3"/>
  <!-- spin axis / angular momentum L -->
  <line x1="150" y1="232" x2="99" y2="152" class="spin" stroke-width="2.5" marker-end="url(#arrowSpin)"/>
  <text x="52" y="146" class="spintext" font-weight="600">L</text>
  <text x="36" y="164" class="spintext">spin axis</text>
  <!-- obliquity -->
  <path d="M 150 180 A 52 52 0 0 0 122 188" class="line" stroke-width="1.2"/>
  <text x="128" y="172" class="ink">γ</text>
  <!-- longitude of the projection -->
  <path d="M 186 232 A 36 16 0 1 1 120 246" class="line" stroke-width="1.2"/>
  <text x="168" y="262" class="ink">λ<tspan font-size="10" dy="3">L</tspan></text>

  <!-- legend text -->
  <text x="22" y="28" class="ink" font-weight="600">Spin axis in the asteroid's own orbital frame</text>
  <text x="22" y="48" class="ink2">lambda_L (λ<tspan font-size="10" dy="3">L</tspan><tspan dy="-3">): longitude of L from perihelion, in the orbital plane</tspan></text>
  <text x="22" y="66" class="ink2">beta_L (β<tspan font-size="10" dy="3">L</tspan><tspan dy="-3">): latitude of L above the plane;   obliquity γ = 90° − β</tspan><tspan font-size="10" dy="3">L</tspan></text>
</svg>
